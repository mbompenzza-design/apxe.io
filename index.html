<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APXe — Цифровая крионика разума</title>
    <style>
        /* Базовые элитарные стили: монохром и аскетизм */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Тонкая верхняя панель статуса */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            letter-spacing: 2px;
            color: #666;
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(5px);
        }

        .secure-tag {
            color: #888;
            animation: pulse-text 2s infinite;
        }

        /* Главный экран */
        .screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 40px 40px 40px;
            text-align: center;
            position: relative;
        }

        /* Пульсирующая 3D сфера ядра (Строгий Монохром) */
        .core-sphere {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0) 70%);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            margin-bottom: 40px;
            animation: rotate-core 20s linear infinite, pulse-core 4s ease-in-out infinite;
            position: relative;
        }

        .core-sphere::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: rotate-core-reverse 10s linear infinite;
        }

        /* Тексты манифеста */
        h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 5px;
            margin-bottom: 20px;
            max-width: 600px;
            line-height: 1.5;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Поле ввода инвайта */
        .invite-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .invite-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: #fff;
            padding: 10px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 4px;
            width: 250px;
            transition: border-color 0.3s;
            margin-bottom: 20px;
        }

        .invite-input:focus {
            outline: none;
            border-color: #888;
        }

        .btn-waitlist {
            font-size: 12px;
            color: #888;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .btn-waitlist:hover {
            color: #fff;
        }

        /* Скрытая секция анкеты */
        .waitlist-form-section {
            display: none;
            width: 100%;
            max-width: 500px;
            margin-top: 40px;
            text-align: left;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 40px;
            animation: fadeIn 0.5s ease;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .form-control {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #222;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #444;
        }

        textarea.form-control {
            resize: none;
        }

        .btn-submit {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 15px 30px;
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background: #cccccc;
        }

        /* Анимации */
        @keyframes rotate-core {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes rotate-core-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes pulse-core {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; border-color: rgba(255,255,255,0.5); }
        }
        @keyframes pulse-text {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10deg); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div>APXe v1.0.4-beta</div>
        <div class="secure-tag">[ quantum-secure / E2EE ]</div>
    </header>

    <main class="screen">
        <!-- Сфера Ядра -->
        <div class="core-sphere"></div>

        <!-- Контент -->
        <h1>Тело — это лишь временный интерфейс.</h1>
        <p class="subtitle">Добро пожаловать в APXe. Начнем фиксацию вашей основы.</p>

        <!-- Блок ввода -->
        <div class="invite-container">
            <input type="text" class="invite-input" placeholder="INVITE CODE" maxlength="12" id="inviteField">
            <button type="button" class="btn-waitlist" onclick="toggleWaitlist()">Подать заявку в лист ожидания →</button>
        </div>

        <!-- Форма закрытой анкеты -->
        <div class="waitlist-form-section" id="waitlistSection">
            <div class="form-group">
                <label>Ваше имя</label>
                <input type="text" id="clientName" class="form-control" placeholder="Имя или псевдоним">
            </div>
            <div class="form-group">
                <label>Ссылка на личный профиль (LinkedIn / X / Telegram)</label>
                <input type="text" id="clientSocial" class="form-control" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Почему для вас важно сохранить цифровой слепок своей личности?</label>
                <textarea id="clientReason" class="form-control" rows="4" placeholder="Ваш развернутый ответ для ИИ-модератора..."></textarea>
            </div>
            <button type="button" class="btn-submit" onclick="submitApplication()">ОТПРАВИТЬ ЗАПРОС НА ИНВАЙТ</button>
        </div>
    </main>

    <script>
        // Скрипт плавного открытия и закрытия анкеты
        function toggleWaitlist() {
            const section = document.getElementById('waitlistSection');
            if (section.style.display === 'block') {
                section.style.display = 'none';
            } else {
                section.style.display = 'block';
                setTimeout(() => {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }, 100);
            }
        }

        // Контур математической маски для инвайтов
        document.getElementById('inviteField').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const code = this.value.trim().toUpperCase();
                if (code.length === 12 && code.startsWith('APX-')) {
                    const lastTwo = code.slice(-2);
                    const digit1 = parseInt(lastTwo.charAt(0), 10);
                    const digit2 = parseInt(lastTwo.charAt(1), 10);
                    
                    if (!isNaN(digit1) && !isNaN(digit2) && (digit1 + digit2 === 9)) {
                        alert("ДОСТУП В КОНТУР РАЗРЕШЕН. Инициализация Ядра...");
                        window.location.href = "https://t.me"; // Целевая ссылка на TWA бота калибровки
                        return;
                    }
                }
                alert("КРИТИЧЕСКАЯ ОШИБКА: Инвайт-код не найден в контуре безопасности или деактивирован.");
            }
        });

        // Отправка данных анкеты в Telegram фаундера через Make.com
        function submitApplication() {
            const WEBHOOK_URL = "https://make.com"; 

            const nameValue = document.getElementById('clientName').value.trim();
            const socialValue = document.getElementById('clientSocial').value.trim();
            const reasonValue = document.getElementById('clientReason').value.trim();

            // Машинная блокировка пустых полей
            if (!nameValue || !socialValue || !reasonValue) {
                alert("КРИТИЧЕСКАЯ ОШИБКА: Протокол не инициализирован. Ожидание ввода метаданных.");
        return;
}
fetch(WEBHOOK_URL, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
name: nameValue,
social: socialValue,
reason: reasonValue
})
}
.then(response => {
if (response.ok) {
// Генератор элитарного листа ожидания (строго от 51 до 99)
const randomQueue = Math.floor(Math.random() * (99 - 51 + 1)) + 51;
alert(КОНТУР ПРИНЯТ. ИИ-скоринг активирован. Порядковый номер в листе фиксации: #0${randomQueue}. Ожидайте верификацию социального графа.);
document.getElementById('clientName').value = "";
document.getElementById('clientSocial').value = "";
document.getElementById('clientReason').value = "";
document.getElementById('waitlistSection').style.display = 'none';
} else {
alert("СИСТЕМНЫЙ СБОЙ: Отказ сетевого шлюза. Повторите цикл запроса.");
}
})
.catch(error => {
console.error("Ошибка:", error);
alert("ОТКАЗ БЕЗОПАСНОСТИ: Контур заблокирован CORS/Брандмауэром на носителе.");
});
    }
