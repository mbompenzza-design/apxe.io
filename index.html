<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APXe — Цифровая крионика разума</title>
    <style>
        /* Базовые элитарные стили: монохром и аскетизм */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Тонкая верхняя панель статуса */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            letter-spacing: 2px;
            color: #666;
            z-index: 10;
            border-bottom: 1px solid rgba(0, 255, 102, 0.03);
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(5px);
        }

        .secure-tag {
            color: #00FF66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            animation: pulse-text 2s infinite;
        }

        /* Главный экран */
        .screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 40px 40px 40px;
            text-align: center;
            position: relative;
        }

        /* Элемент 1: Пульсирующая 3D сфера ядра (Фирменный неоново-зеленый) */
        .core-sphere {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 102, 0.15) 0%, rgba(0,0,0,0) 70%);
            border: 1px dashed rgba(0, 255, 102, 0.3);
            margin-bottom: 40px;
            animation: rotate-core 20s linear infinite, pulse-core 4s ease-in-out infinite;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.05);
        }

        .core-sphere::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            border: 1px solid rgba(0, 255, 102, 0.1);
            animation: rotate-core-reverse 10s linear infinite;
        }

        /* Тексты манифеста */
        h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 5px;
            margin-bottom: 20px;
            max-width: 600px;
            line-height: 1.5;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Поле ввода инвайта */
        .invite-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .invite-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #222;
            color: #fff;
            padding: 10px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 4px;
            width: 250px;
            transition: border-color 0.3s;
            margin-bottom: 20px;
        }

        .invite-input:focus {
            outline: none;
            border-color: #00FF66;
            box-shadow: 0 1px 10px rgba(0, 255, 102, 0.1);
        }

        .btn-waitlist {
            font-size: 12px;
            color: #666;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .btn-waitlist:hover {
            color: #00FF66;
        }

        /* Скрытая секция анкеты */
        .waitlist-form-section {
            display: none;
            width: 100%;
            max-width: 500px;
            margin-top: 40px;
            text-align: left;
            border-top: 1px solid rgba(0, 255, 102, 0.05);
            padding-top: 40px;
            animation: fadeIn 0.5s ease;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .form-control {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #00FF66;
        }

        textarea.form-control {
            resize: none;
        }

        .btn-submit {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 15px 30px;
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background: #00FF66;
            color: #000000;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }

        /* Анимации */
        @keyframes rotate-core {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes rotate-core-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes pulse-core {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; border-color: rgba(0, 255, 102, 0.6); }
        }
        @keyframes pulse-text {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10deg); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div>APXe v1.0.4-beta</div>
        <div class="secure-tag">[ quantum-secure / E2EE ]</div>
    </header>

    <main class="screen">
        <!-- Сфера Ядра -->
        <div class="core-sphere"></div>

        <!-- Контент -->
        <h1>Тело — это лишь временный интерфейс.</h1>
        <p class="subtitle">Добро пожаловать в APXe. Начнем фиксацию вашей основы.</p>

        <!-- Блок ввода -->
        <div class="invite-container">
            <input type="text" class="invite-input" placeholder="INVITE CODE" maxlength="12" id="inviteField">
            <button class="btn-waitlist" onclick="toggleWaitlist()">Подать заявку в лист ожидания →</button>
        </div>

        <!-- Форма закрытой анкеты -->
        <form class="waitlist-form-section" id="waitlistSection" onsubmit="submitApplication(event)">
            <div class="form-group">
                <label>Ваше имя</label>
                <input type="text" id="clientName" class="form-control" placeholder="Имя или псевдоним" required>
            </div>
            <div class="form-group">
                <label>Ссылка на личный профиль (LinkedIn / X / Telegram)</label>
                <input type="text" id="clientSocial" class="form-control" placeholder="https://..." required>
            </div>
            <div class="form-group">
                <label>Почему для вас важно сохранить цифровой слепок своей личности?</label>
                <textarea id="clientReason" class="form-control" rows="4" placeholder="Ваш развернутый ответ для ИИ-модератора..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">ОТПРАВИТЬ ЗАПРОС НА ИНВАЙТ</button>
        </form>
    </main>

    <script>
        // Скрипт открытия анкеты
        function toggleWaitlist() {
            const section = document.getElementById('waitlistSection');
            section.style.display = section.style.display === 'block' ? 'none' : 'block';
            if(section.style.display === 'block') {
                window.scrollTo(0, document.body.scrollHeight);
            }
        }

        // Отправка данных анкеты в Telegram
        function submitApplication(event) {
            event.preventDefault(); // Предотвращаем перезагрузку страницы

            // --- НАСТРОЙКА ИНТЕГРАЦИИ (ЗАПОЛНИТЬ ПЕРЕД ДЕПЛОЕМ) ---
            const TELEGRAM_BOT_TOKEN = "ВАШ_ТОКЕН_БОТА"; 
            const TELEGRAM_CHAT_ID = "ВАШ_CHAT_ID_КАНАЛА_ИЛИ_ЧАТА"; 
            // -----------------------------------------------------

            const name = document.getElementById('clientName').value;
            const social = document.getElementById('clientSocial').value;
            const reason = document.getElementById('clientReason').value;

            // Формируем красивый лог для админки фаундера
            const message = `⚡️ <b>НОВАЯ АНКЕТА APXe</b>\n\n` +
                            `👤 <b>Имя:</b> ${name}\n` +
                            `🌐 <b>Профиль:</b> ${social}\n\n` +
                            `🧠 <b>Мотивация:</b>\n<i>"${reason}"</i>`;

            const url = `https://telegram.org{TELEGRAM_BOT_TOKEN}/sendMessage`;

            // Отправляем запрос методом POST через fetch
            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: "HTML"
                })
            })
            .then(response => {
