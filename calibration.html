<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APXe — Квантовое Ядро WebGL v4.0</title>

    <!-- Подключаем Three.js как модуль -->
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // Инициализация глобальных переменных Three.js
        let scene, camera, renderer, coreGroup, coreMesh, wireframeMesh, internalLight;
        
        // Глобальные стейты и параметры динамики ядра
        let currentCenter = { x: 0, y: 0 };
        let targetCenter = { x: 0, y: 0 };
        let currentRadius = 1.0; 
        let targetRadius = 1.0;
        
        let appState = 0; 
        let audioModifier = 0; 
        let isRecording = false;

        function initWebGL() {
            const container = document.getElementById('canvas-container');
            if (!container) return;
            
            // 1. Создание 3D сцены
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.15);

            // 2. Настройка перспективной камеры
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 6;

            // 3. Инициализация WebGL рендерера
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            
            container.appendChild(renderer.domElement);

            coreGroup = new THREE.Group();
            scene.add(coreGroup);

            window.addEventListener('resize', onWindowResize);
            updateCoreTargetPositions();
            createCoreGeometry();
            animateWebGL();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateCoreTargetPositions();
        }

        function updateCoreTargetPositions() {
            if (appState === 1) {
                targetCenter.y = 1.1;
                targetRadius = 0.65;
            } else {
                targetCenter.y = -0.1;
                targetRadius = 1.0;
            }
        }
        
        function createCoreGeometry() {
            const geometry = new THREE.IcosahedronGeometry(1.6, 2);
            const count = geometry.attributes.position.count;
            const positionAttribute = geometry.attributes.position;
            const customPositions = [];
            
            for (let i = 0; i < count; i += 3) {
                const ax = positionAttribute.getX(i), ay = positionAttribute.getY(i), az = positionAttribute.getZ(i);
                const bx = positionAttribute.getX(i+1), by = positionAttribute.getY(i+1), bz = positionAttribute.getZ(i+1);
                const cx = positionAttribute.getX(i+2), cy = positionAttribute.getY(i+2), cz = positionAttribute.getZ(i+2);
                
                const center = { x: (ax+bx+cx)/3, y: (ay+by+cy)/3, z: (az+bz+cz)/3 };
                const scale = 0.92;
                
                customPositions.push(
                    center.x + (ax - center.x) * scale, center.y + (ay - center.y) * scale, center.z + (az - center.z) * scale,
                    center.x + (bx - center.x) * scale, center.y + (by - center.y) * scale, center.z + (bz - center.z) * scale,
                    center.x + (cx - center.x) * scale, center.y + (cy - center.y) * scale, center.z + (cz - center.z) * scale
                );
            }
            
            const bufferGeometry = new THREE.BufferGeometry();
            bufferGeometry.setAttribute('position', new THREE.Float32BufferAttribute(customPositions, 3));
            bufferGeometry.computeVertexNormals();

            const faceMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x000c05,
                emissive: 0x003311,
                roughness: 0.2,
                metalness: 0.9,
                transparent: true,
                opacity: 0.85,
                side: THREE.DoubleSide
            });
            
            coreMesh = new THREE.Mesh(bufferGeometry, faceMaterial);
            coreGroup.add(coreMesh);

            const wireMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ff66,
                wireframe: true,
                transparent: true,
                opacity: 0.6
            });
            
            wireframeMesh = new THREE.Mesh(bufferGeometry, wireMaterial);
            wireframeMesh.scale.setScalar(1.002);
            coreGroup.add(wireframeMesh);

            internalLight = new THREE.PointLight(0x00ff66, 3, 10);
            internalLight.position.set(0, 0, 0);
            scene.add(internalLight);
            
            const ambientLight = new THREE.AmbientLight(0x001105, 1.5);
            scene.add(ambientLight);
        }

        function animateWebGL() {
            requestAnimationFrame(animateWebGL);

            coreGroup.position.y += (targetCenter.y - coreGroup.position.y) * 0.08;
            
            const currentScale = coreGroup.scale.x;
            const nextScale = currentScale + (targetRadius - currentScale) * 0.08;
            coreGroup.scale.setScalar(nextScale);

            const rotationSpeedX = 0.003 + (audioModifier * 0.015);
            const rotationSpeedY = 0.005 + (audioModifier * 0.02);
            coreGroup.rotation.x += rotationSpeedX;
            coreGroup.rotation.y += rotationSpeedY;

            const time = performance.now() * 0.002;
            const pulse = Math.sin(time) * 0.15;
            internalLight.intensity = 2.5 + (audioModifier * 8.0) + pulse;

            const dynamicMeshScale = 1.0 + Math.sin(time * 2) * 0.01 + (audioModifier * 0.06);
            coreMesh.scale.setScalar(dynamicMeshScale);
            wireframeMesh.scale.setScalar(dynamicMeshScale * 1.002);

            renderer.render(scene, camera);
        }

        initWebGL();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #000000; color: #ffffff; overflow: hidden; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #floating-logs { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1.5; pointer-events: none; overflow: hidden; }
        
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        .interactive { pointer-events: auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 1px solid rgba(0,255,102,0.05); padding-bottom: 12px; }
        .btn-exit { background: transparent; border: 1px solid #005522; color: #00ff66; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; font-weight: bold; transition: all 0.3s; outline: none; }
        .btn-exit:hover { background: rgba(0,255,102,0.1); border-color: #00ff66; }
        .qcu-badge { background: rgba(0,0,0,0.85); border: 1px solid rgba(0,255,102,0.2); padding: 6px 12px; font-size: 11px; color: #00ff66; font-weight: bold; border-radius: 3px; box-shadow: 0 0 8px rgba(0,255,102,0.1); }
        
        .ai-prompter-box { width: 100%; margin-top: 15px; background: rgba(0,0,0,0.8); border-left: 2px solid #00ff66; padding: 12px; min-height: 60px; backdrop-filter: blur(5px); }
        .ai-title { font-size: 10px; color: #008844; letter-spacing: 1px; margin-bottom: 4px; }
        .ai-text { font-size: 13px; line-height: 1.4; color: #ffffff; min-height: 18px; white-space: pre-wrap; word-break: break-word; }
        
        .control-container { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .tracker-mini { display: flex; justify-content: space-between; font-size: 10px; color: #008844; letter-spacing: 1px; }
        .progress-bar-bg { width: 100%; height: 2px; background: rgba(0,255,102,0.05); position: relative; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: #00ff66; transition: width 0.4s ease; box-shadow: 0 0 10px #00ff66; }
        
        .input-circuit-box { display: flex; background: rgba(0,0,0,0.95); border: 1px solid rgba(0,255,102,0.15); border-radius: 4px; padding: 6px; backdrop-filter: blur(10px); }
        .text-input-field { flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-size: 13px; padding: 8px 10px; }
        .text-input-field::placeholder { color: #004411; transition: color 0.3s ease; }
        
        .btn-action { background: transparent; border: none; color: #00ff66; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; border-radius: 3px; outline: none; }
        .btn-action:hover { background: rgba(0,255,102,0.08); }
        .btn-action.recording { color: #ff3333; animation: pulseGlow 1.5s infinite; }
        
        .ai-tag { position: absolute; font-size: 11px; color: #00ff66; transform: translate(-50%, -50%); opacity: 0; animation: floatAndFade 4s linear forwards; font-weight: bold; white-space: nowrap; z-index: 1.8; pointer-events: none; }
        
        @keyframes floatAndFade { 0% { opacity: 0; transform: translate(-50%, -50%) translateY(8px); } 15% { opacity: 0.9; } 85% { opacity: 0.5; } 100% { opacity: 0; transform: translate(-50%, -50%) translateY(-15px); } }
        @keyframes pulseGlow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="floating-logs"></div>
    
    <div class="ui-layer">
        <div class="interactive">
            <header>
                <button class="btn-exit" onclick="returnToDashboard()">◀ ЛК</button>
                <div class="qcu-badge">БАЛАНС: <span id="qcuBalanceText">1000</span> QCU</div>
            </header>
            <div class="ai-prompter-box">
                <div class="ai-title">// КВАНТОВЫЙ СУФЛЕР ИИ //</div>
                <div class="ai-text" id="aiQuestionText">Синхронизация квантовых каналов...</div>
            </div>
        </div>
        <div class="control-container interactive">
            <div class="tracker-mini">
                <div>СИНХРОНИЗАЦИЯ СЛЕПКА: <span id="progressPercent">0.0%</span></div>
                <div id="currentStageText">РАУНД 0/5</div>
            </div>
