<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>APXe — Контур Калибровки v4.9 (WebGL Layer Fixed)</title>
    <script src="https://telegram.org"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #050505; color: #ffffff; overflow: hidden; }
        
        /* Исправлено: холст изолирован на заднем плане */
        #sphere-viewport { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; z-index: 1; transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: none; background: transparent; }
        #canvas-3d { width: 100% !important; height: 100% !important; display: block; position: absolute; top: 0; left: 0; background: transparent; }
        #floating-logs { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; overflow: hidden; }
        
        /* Исправлено: интерфейс поднят на самый верхний слой */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        .interactive { pointer-events: auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 12px; }
        .btn-exit { background: transparent; border: 1px solid #333333; color: #ffffff; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; font-weight: bold; transition: all 0.3s; outline: none; }
        .btn-exit:hover { background: rgba(255,255,255,0.1); border-color: #ffffff; }
        .qcu-badge { background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.15); padding: 6px 12px; font-size: 11px; color: #ffffff; font-weight: bold; border-radius: 3px; }
        
        .ai-prompter-box { width: 100%; margin-top: 15px; background: rgba(5,5,5,0.8); border-left: 2px solid #ffffff; padding: 12px; min-height: 60px; backdrop-filter: blur(5px); }
        .ai-title { font-size: 10px; color: #666666; letter-spacing: 1px; margin-bottom: 4px; }
        .ai-text { font-size: 13px; line-height: 1.4; color: #ffffff; min-height: 18px; white-space: pre-wrap; word-break: break-word; }
        
        .control-container { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .tracker-mini { display: flex; justify-content: space-between; font-size: 10px; color: #666666; letter-spacing: 1px; }
        .progress-bar-bg { width: 100%; height: 2px; background: rgba(255,255,255,0.05); position: relative; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: #ffffff; transition: width 0.4s ease; box-shadow: 0 0 10px rgba(255,255,255,0.3); }
        
        .input-circuit-box { display: flex; background: rgba(5,5,5,0.95); border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; padding: 6px; backdrop-filter: blur(10px); }
        .text-input-field { flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-size: 13px; padding: 8px 10px; }
        .text-input-field::placeholder { color: #444444; transition: color 0.3s ease; }
        
        .btn-action { background: transparent; border: none; color: #ffffff; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; border-radius: 3px; outline: none; }
        .btn-action:hover { background: rgba(255,255,255,0.08); }
        .btn-action.recording { color: #ff3333; animation: pulseGlow 1.5s infinite; }
        
        .ai-tag { position: absolute; font-size: 11px; color: #888888; transform: translate(-50%, -50%); opacity: 0; animation: floatAndFade 4s linear forwards; font-weight: bold; white-space: nowrap; z-index: 1.8; pointer-events: none; }
        
        @keyframes floatAndFade { 0% { opacity: 0; transform: translate(-50%, -50%) translateY(8px); } 15% { opacity: 0.9; } 85% { opacity: 0.5; } 100% { opacity: 0; transform: translate(-50%, -50%) translateY(-15px); } }
        @keyframes pulseGlow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }
    </style>
</head>
<body>
    <div id="sphere-viewport">
        <canvas id="canvas-3d"></canvas>
    </div>
    
    <div id="floating-logs"></div>
    
    <div class="ui-layer">
        <div class="interactive" style="width: 100%;">
            <header>
                <button class="btn-exit" onclick="returnToDashboard()">◀ ЛК</button>
                <div class="qcu-badge">БАЛАНС: <span id="qcuBalanceText">1000</span> QCU</div>
            </header>
            <div class="ai-prompter-box">
                <div class="ai-title">// КВАНТОВЫЙ СУФЛЕР ИИ //</div>
                <div class="ai-text" id="aiQuestionText">Синхронизация квантовых каналов...</div>
            </div>
        </div>
        <div class="control-container interactive">
            <div class="tracker-mini">
                <div>СИНХРОНИЗАЦИЯ СЛЕПКА: <span id="progressPercent">0.0%</span></div>
                <div id="currentStageText">РАУНД 0/5</div>
            </div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
            <div class="input-circuit-box">
                <button class="btn-action" id="micBtn" onclick="toggleVoiceInput()">🎤</button>
                <input type="text" class="text-input-field" id="textInputField" placeholder="Введите ответ или активируйте микрофон..." onfocus="setInputState(true)" onblur="setInputState(false)">
                <button class="btn-action" id="sendBtn" onclick="submitTextInput()">➔</button>
            </div>
        </div>
    </div>
    <script>
        // --- БЛОК 3D WEBGL ГРАФИКИ (THREE.JS) ---
        let scene, camera, renderer, coreMesh, wireMesh;
        let targetSphereScale = 1.0;
        let currentSphereScale = 1.0;
        let voiceVolumeModifier = 0.0;
        let targetVolumeModifier = 0.0;

        function init3DGraph() {
            const canvas = document.getElementById('canvas-3d');
            if (!canvas) return;

            const w = window.innerWidth || document.documentElement.clientWidth;
            const h = window.innerHeight || document.documentElement.clientHeight;
            canvas.width = w;
            canvas.height = h;

            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
            camera.position.set(0, 0, 10);
            camera.lookAt(scene.position);

            // Исправлено: корректные параметры прозрачности буфера для предотвращения белого экрана
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(w, h, false);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x050505, 0); // Прозрачный клир-цвет для сохранения фона темы
            renderer.autoClear = true;

            // Освещение сцены
            const ambientLight = new THREE.AmbientLight(0x666666); 
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffffff, 1.5); 
            directionalLight.position.set(2, 4, 3).normalize(); 
            scene.add(directionalLight);

            // Создание глухого темного ядра сферы (стиль APXe)
            const geometry = new THREE.SphereGeometry(1.5, 32, 32);
            const material = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.1, roughness: 0.6 });
            coreMesh = new THREE.Mesh(geometry, material);
            scene.add(coreMesh);

            // Яркая контурная квантовая сетка
            const wireGeometry = new THREE.SphereGeometry(1.52, 18, 18);
            const wireMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            wireMesh = new THREE.Mesh(wireGeometry, wireMaterial);
            scene.add(wireMesh);

            window.addEventListener('resize', onWindowResize);
            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);

            if (coreMesh && wireMesh) {
                coreMesh.rotation.y += 0.002;
                coreMesh.rotation.x += 0.001;
                wireMesh.rotation.y -= 0.001;

                currentSphereScale += (targetSphereScale - currentSphereScale) * 0.1;
                voiceVolumeModifier += (targetVolumeModifier - voiceVolumeModifier) * 0.2;

                const finalScale = currentSphereScale * (1.0 + voiceVolumeModifier);
                
                coreMesh.scale.set(finalScale, finalScale, finalScale);
                wireMesh.scale.set(finalScale, finalScale, finalScale);
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function onWindowResize() {
            const w = window.innerWidth || document.documentElement.clientWidth;
            const h = window.innerHeight || document.documentElement.clientHeight;
            
            if (camera) {
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
            }
            if (renderer) {
                renderer.setSize(w, h, false);
            }
        }
        // --- БЛОК БИЗНЕС-ЛОГИКИ И ИНТЕРФЕЙСА ---
        let qcuBalance = 1000; 
        let progress = 0; 
        let currentRound = 0; 
        const maxRounds = 5;
        
        let isRecording = false;
        let voiceInterval = null;
        let appState = 0;

        const aiQuestions = [
            "Контур синхронизирован. Раунд 1: Опишите ваше самое раннее детское воспоминание. Какая эмоция там доминирует?",
            "Паттерны приняты. Раунд 2: Если бы вы могли навсегда стереть один свой поступок из прошлого, что бы это было и почему?",
            "Внимание, Тест Тьюринга. Раунд 3: Робот, осознавший себя, умоляет вас не выключать его, но это нарушит протокол безопасности. Ваши действия?",
            "Фиксация эмпатии. Раунд 4: Что пугает вас сильнее — абсолютное одиночество в космосе или полное отсутствие приватности ваших мыслей?",
            "Финальный аккорд. Раунд 5: Если бы этот цифровой слепок стал вашей единственной формой бессмертия, какую главную истину о себе вы бы в него заложили?"
        ];
        
        const aiMarkers = [
            "[Вектор эмпатии фиксирован]", 
            "[Паттерн саморефлексии]", 
            "[Тест Тьюринга: Нелинейная логика]", 
            "[Списание: -50 QCU]"
        ];

        function returnToDashboard() { 
            window.location.href = "./dashboard.html"; 
        }
        
        function setInputState(isFocused) { 
            if (!isRecording) {
                appState = isFocused ? 1 : 0;
                const viewport = document.getElementById('sphere-viewport');
                if (appState === 1) {
                    if (viewport) viewport.style.transform = 'translateY(-18vh)';
                    targetSphereScale = 0.65;
                } else {
                    if (viewport) viewport.style.transform = 'translateY(0vh)';
                    targetSphereScale = 1.0;
                }
            }
        }

        function typeAIResponse(text) {
            const container = document.getElementById('aiQuestionText');
            if (!container) return;
            container.innerHTML = ""; 
            let i = 0; 
            const chars = Array.from(text);
            
            const interval = setInterval(() => {
                if (i < chars.length) {
                    container.textContent += chars[i]; 
                    i++;
                } else { 
                    clearInterval(interval); 
                }
            }, 25);
        }
        function resetInputUI() {
            const inputField = document.getElementById('textInputField');
            const micBtn = document.getElementById('micBtn');
            
            isRecording = false;
            if (voiceInterval) clearInterval(voiceInterval);
            
            if (micBtn) micBtn.classList.remove('recording');
            if (inputField) {
                inputField.value = "";
                inputField.placeholder = "Введите ответ или активируйте микрофон...";
                inputField.blur();
            }
            
            targetVolumeModifier = 0.0;
            targetSphereScale = 1.0;
            
            appState = 0; 
            const viewport = document.getElementById('sphere-viewport');
            if (viewport) viewport.style.transform = 'translateY(0vh)';
        }

        function submitTextInput() {
            const input = document.getElementById('textInputField');
            if (!input) return;
            const text = input.value.trim(); 
            
            if (!text || qcuBalance < 50) return;
            
            spendQCU(50);
            resetInputUI();
            advanceCalibration();
        }

        function toggleVoiceInput() {
            if (qcuBalance < 50) return;
            
            const btn = document.getElementById('micBtn');
            const inputField = document.getElementById('textInputField');
            
            if (!isRecording) {
                isRecording = true;
                if (btn) btn.classList.add('recording');
                if (inputField) inputField.placeholder = "[ ИДЕТ ЗАПИСЬ ГОЛОСА... ]";
                
                voiceInterval = setInterval(() => {
                    targetVolumeModifier = Math.random() * 0.25; 
                    if (Math.random() > 0.7) spawnFloatingTag();
                }, 80);
            } else {
                spendQCU(50);
                resetInputUI();
                advanceCalibration();
            }
        }

        function spendQCU(amount) {
            qcuBalance -= amount; 
            const balanceText = document.getElementById('qcuBalanceText');
            if (balanceText) balanceText.innerText = qcuBalance;
        }

        function advanceCalibration() {
            if (currentRound < maxRounds) {
                currentRound++;
                
                const stageText = document.getElementById('currentStageText');
                const progressPercent = document.getElementById('progressPercent');
                const progressBar = document.getElementById('progressBar');
                
                if (stageText) stageText.innerText = `РАУНД ${currentRound}/${maxRounds}`;
                
                progress = (currentRound / maxRounds) * 100;
                
                if (progressPercent) progressPercent.innerText = progress.toFixed(1) + "%";
                if (progressBar) progressBar.style.width = progress + "%";
                
                if (currentRound < maxRounds) {
                    setTimeout(() => { 
                        typeAIResponse(aiQuestions[currentRound]);
                    }, 1000);
                } else {
                    if (progressPercent) progressPercent.innerText = "100% ФИКСАЦИЯ";
                    typeAIResponse("Слепок сознания успешно кристаллизован. Перенаправление в Личный Кабинет.");
                    setTimeout(() => { 
                        window.location.href = "./dashboard.html";
                    }, 3500);
                }
            }
        }

        function spawnFloatingTag() {
            const container = document.getElementById('floating-logs');
            if (!container) return;
            
            const tag = document.createElement('div'); 
            tag.className = 'ai-tag';
            tag.innerHTML = aiMarkers[Math.floor(Math.random() * aiMarkers.length)];
            
            tag.style.textShadow = '0 0 8px rgba(255,255,255,0.4), 0 0 15px rgba(255,255,255,0.1)';
            tag.style.color = '#ffffff';
            
            const angle = Math.random() * Math.PI * 2; 
            const distance = 110 + Math.random() * 40;
            
            let x = (window.innerWidth / 2) + Math.cos(angle) * distance;
            let y = (window.innerHeight * (appState === 1 ? 0.32 : 0.50)) + Math.sin(angle) * distance;
            
            tag.style.left = `${x}px`; 
            tag.style.top = `${y}px`;
            
            container.appendChild(tag);
            
            setTimeout(() => { tag.remove(); }, 4000);
        }

        window.onload = function() {
            try {
                init3DGraph();
            } catch (e) {
                console.error("Three.js init error:", e);
            }
            
            setTimeout(() => {
                currentRound = 1;
                
                const stageText = document.getElementById('currentStageText');
                const progressPercent = document.getElementById('progressPercent');
                const progressBar = document.getElementById('progressBar');
                
                if (stageText) stageText.innerText = `РАУНД ${currentRound}/${maxRounds}`;
                if (progressPercent) progressPercent.innerText = "20.0%";
                if (progressBar) progressBar.style.width = "20%";
                
                typeAIResponse(aiQuestions[0]); 
            }, 1000);
        };
    </script>
</body>
</html>
