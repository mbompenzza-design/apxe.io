<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APXe — Контур Калибровки</title>
    <script src="https://telegram.org"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #020606; color: #ffffff; overflow: hidden; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 30px 20px; }
        .interactive { pointer-events: auto; }

        header { display: flex; justify-content: space-between; width: 100%; font-size: 11px; letter-spacing: 1px; color: #154545; border-bottom: 1px solid rgba(0,255,150,0.05); padding-bottom: 15px; }
        .status-active { color: #00ffcc; text-shadow: 0 0 8px rgba(0,255,200,0.4); animation: blink 1.5s infinite; }

        /* Контейнер для свободно летающих тегов ИИ */
        #floating-logs { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1.5; pointer-events: none; overflow: hidden; }
        
        /* Стиль живого тега с эффектом плавного растворения за 5 секунд */
        .ai-tag { position: absolute; font-size: 10px; color: #00aa99; letter-spacing: 0.5px; white-space: nowrap; transform: translate(-51%, -50%); opacity: 0; animation: floatAndFade 5s linear forwards; }
        .ai-tag span { color: #fff; text-shadow: 0 0 4px #00ffcc; }

        .tracker-box { width: 100%; background: rgba(2,10,10,0.9); border: 1px solid rgba(0,255,200,0.1); padding: 20px; backdrop-filter: blur(10px); border-radius: 4px; }
        .tracker-info { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 1px; color: #008877; margin-bottom: 10px; }
        .progress-bar-bg { width: 100%; height: 2px; background: rgba(0,255,200,0.05); position: relative; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: #00ffcc; transition: width 0.5s ease; box-shadow: 0 0 10px #00ffcc; }

        .btn-audio-init { background: transparent; border: 1px solid #005544; color: #00ffcc; padding: 15px; width: 100%; font-size: 12px; letter-spacing: 2px; cursor: pointer; transition: all 0.3s; margin-top: 15px; font-weight: bold; text-shadow: 0 0 5px #00ffcc; }
        .btn-audio-init:hover { background: #00ffcc; color: #020606; }
        .btn-audio-init.active { border-color: #00ffcc; color: #00ffcc; background: rgba(0,255,200,0.05); }

        @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        
        /* Анимация для тегов: плавное появление, небольшой дрейф вверх и растворение к 5-й секунде */
        @keyframes floatAndFade {
            0% { opacity: 0; transform: translate(-50%, -50%) translateY(10px); }
            15% { opacity: 0.8; }
            75% { opacity: 0.6; }
            100% { opacity: 0; transform: translate(-50%, -50%) translateY(-20px); }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="coreCanvas"></canvas>
    </div>

    <!-- Слой для летающих комментариев -->
    <div id="floating-logs"></div>

    <div class="ui-layer">
        <header>
            <div id="versionTag">APXe // QUANTUM_CORE</div>
            <div class="status-active">[ СКАНИРОВАНИЕ РАЗУМА ]</div>
        </header>

        <div class="tracker-box interactive">
            <div class="tracker-info">
                <div>КРИСТАЛЛИЗАЦИЯ МЕНТАЛЬНОГО СЛЕПКА</div>
                <div id="progressPercent">0.0%</div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <button class="btn-audio-init" id="audioBtn" onclick="initAudioCircuit()">ИНИЦИИРОВАТЬ АУДИОКОНТУР</button>
        </div>
    </div>

    <script>
                // --- ИНИЦИАЛИЗАЦИЯ TELEGRAM SDK ---
        const tg = window.Telegram?.WebApp;
        let userTag = "[GUEST]";
        if (tg) {
            tg.ready(); tg.expand();
            if (tg.initDataUnsafe?.user?.username) {
                userTag = `@${tg.initDataUnsafe.user.username}`;
            } else if (tg.initDataUnsafe?.user?.first_name) {
                userTag = tg.initDataUnsafe.user.first_name;
            }
            document.getElementById('versionTag').innerText = `APXe // CORE // ${userTag.toUpperCase()}`;
        }

        // --- НАСТРОЙКА КАНВАСА ДЛЯ КИБЕР-КОЛЬЦА ---
        const canvas = document.getElementById('coreCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Параметры анимации ядра
        let mainRotation = 0;
        let innerRotation = 0;
        let pulseRadius = 90;
        let audioModifier = 0; 
        let globalTime = 0;

        // Массив утолщенных лучей (вращение замедлено в 4 раза)
        const particles = [];
        for (let i = 0; i < 35; i++) {
            particles.push({
                angle: Math.random() * Math.PI * 2,
                length: 40 + Math.random() * 60,
                speed: (0.01 + Math.random() * 0.015) / 4, // Медленнее в 4 раза
                opacity: 0.3 + Math.random() * 0.4,
                waveOffset: Math.random() * 100 // Смещение для перелива
            });
        }

        // --- ФУНКЦИЯ ОТРИСОВКИ КОНТУРА ЯДРА ---
        function drawCyberCore() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            globalTime += 0.05;
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Динамический радиус, зависящий от микрофона
            const currentRadius = pulseRadius + (audioModifier * 40);
            
            // Свечение неонового контура
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#00ffcc';
            
            // 1. Утолщенные лучи с пульсацией и переливом по направлению К СФЕРЕ
            particles.forEach(p => {
                p.angle += p.speed * (1 + audioModifier * 2);
                
                const startX = centerX + Math.cos(p.angle) * currentRadius;
                const startY = centerY + Math.sin(p.angle) * currentRadius;
                const endX = centerX + Math.cos(p.angle) * (currentRadius + p.length);
                const endY = centerY + Math.sin(p.angle) * (currentRadius + p.length);
                
                // Создаем линейный градиент вдоль луча, чтобы пустить волну к центру
                const gradient = ctx.createLinearGradient(endX, endY, startX, startY);
                
                // Бегущая фаза пульсации (эффект втягивания к сфере)
                let wavePosition = (globalTime * 0.4 + p.waveOffset * 0.01) % 1;
                let nextPos = (wavePosition + 0.2) % 1;
                
                gradient.addColorStop(0, `rgba(0, 200, 180, ${p.opacity * 0.2})`);
                gradient.addColorStop(wavePosition, `rgba(0, 255, 200, ${p.opacity})`);
                gradient.addColorStop(nextPos, `rgba(255, 255, 255, ${p.opacity * 1.5})`);
                gradient.addColorStop(1, `rgba(0, 255, 200, ${p.opacity * 0.3})`);
                
                ctx.beginPath();
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 3.0; // Сделано толще
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            });
            
            // 2. Главное орбитальное кольцо (в 2 раза шире)
            ctx.beginPath();
            ctx.arc(centerX, centerY, currentRadius, 0, Math.PI * 2);
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 6; // В 2 раза шире
            ctx.stroke();
            
            // 3. Второе внутреннее кольцо (в 3 раза тоньше, вращается в обратную сторону)
            ctx.save();
            ctx.translate(centerX, centerY);
            innerRotation -= 0.008 + (audioModifier * 0.02); // Минус — вращение обратно
            ctx.rotate(innerRotation);
            ctx.beginPath();
            ctx.arc(0, 0, currentRadius - 20, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0, 255, 200, 0.7)';
            ctx.lineWidth = 2; // В 3 раза тоньше главного
            ctx.stroke();
            ctx.restore();
            
            ctx.shadowBlur = 0; // Сброс тени
            requestAnimationFrame(drawCyberCore);
        }
        
        drawCyberCore();
                // --- СИНХРОНИЗАЦИЯ ГОЛОСА И МИКРОФОНА ---
        let audioContext, analyser, dataArray;
        let isAudioInitialized = false;

        function initAudioCircuit() {
            if (isAudioInitialized) return;

            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 32;
                    
                    const source = audioContext.createMediaStreamSource(stream);
                    source.connect(analyser);
                    
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    isAudioInitialized = true;
                    
                    const btn = document.getElementById('audioBtn');
                    btn.innerText = "РЕЧЕВОЙ КОНТУР СИНХРОНИЗИРОВАН";
                    btn.classList.add('active');
                    
                    function updateAudioData() {
                        if (!isAudioInitialized) return;
                        analyser.getByteFrequencyData(dataArray);
                        let sum = 0;
                        for (let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
                        audioModifier = sum / dataArray.length / 255;
                        requestAnimationFrame(updateAudioData);
                    }
                    updateAudioData();
                    startSimulation();
                })
                .catch(err => {
                    console.error("Ошибка микрофона:", err);
                    alert("Требуется доступ к аудиопотоку для фиксации частот.");
                });
        }

        // --- КОНТУР РАНДОМНЫХ ХАОТИЧНЫХ ТЕГОВ ---
        const aiMarkers = [
            `[Юзер: <span>${userTag}</span> -> Анализ паттернов]`,
            "[Смысловой маркер: <span>Фигура отца -> Архетип Защитника</span>]",
            "[Лингво-структура: <span>Сложный синтаксический паттерн</span>]",
            "[Психо-метрика: <span>Высокий порог когнитивной эмпатии</span>]",
            "[Логический контур: <span>Рационализация кризисных состояний</span>]",
            "[Смысловой маркер: <span>Экзистенциальный вектор развития</span>]",
            "[Голосовой маркер: <span>Частотные модуляции зафиксированы</span>]",
            "[Веса личности: <span>Генерация уникального RAG-вектора</span>]",
            "[Безопасность: <span>Шифрование данных алгоритмом E2EE</span>]"
        ];

        // Функция рождения тегов в случайных точках вокруг сферы
        function spawnFloatingTag() {
            if (!isAudioInitialized) return;
            
            const container = document.getElementById('floating-logs');
            const tag = document.createElement('div');
            tag.className = 'ai-tag';
            tag.innerHTML = aiMarkers[Math.floor(Math.random() * aiMarkers.length)];
            
            // Расчет случайных координат вокруг центра экрана
            const angle = Math.random() * Math.PI * 2;
            const distance = 140 + Math.random() * 80; // Дистанция за пределами колец
            const x = (window.innerWidth / 2) + Math.cos(angle) * distance;
            const y = (window.innerHeight / 2) + Math.sin(angle) * distance;
            
            tag.style.left = `${x}px`;
            tag.style.top = `${y}px`;
            
            container.appendChild(tag);
            
            // Удаляем элемент строго через 5 секунд после окончания анимации
            setTimeout(() => { tag.remove(); }, 5000);
        }

        let progress = 0;
        function startSimulation() {
            const interval = setInterval(() => {
                if (progress < 100) {
                    const increment = Math.max(0.08, (100 - progress) * 0.04);
                    progress += Math.random() * increment;
                    if (progress > 100) progress = 100;
                    
                    document.getElementById('progressPercent').innerText = progress.toFixed(1) + "%";
                    document.getElementById('progressBar').style.width = progress + "%";
                    
                    // Запуск хаотичного всплытия тегов
                    if (Math.random() > 0.4) spawnFloatingTag();
                } else {
                    clearInterval(interval);
                    document.getElementById('progressPercent').innerText = "100% ФИКСАЦИЯ";
                    document.getElementById('audioBtn').innerText = "ЯДРО ДЕПОНИРОВАНО";
                    
                    setTimeout(() => {
                        if (tg) {
                            tg.sendData(JSON.stringify({ status: "crystallized", user: userTag }));
                            tg.close();
                        }
                    }, 2000);
                }
            }, 700);
        }
    </script>
</body>
</html>
