<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APXe — Контур Калибровки v2.8</title>
    <script src="https://telegram.org"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; user-select: none; }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            background-color: #010604; 
            color: #ffffff; 
            overflow: hidden; 
            position: relative;
        }

        /* Защитная сетка квантового монитора */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 102, 0.04) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        .ui-layer { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 2; 
            pointer-events: none; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 30px 24px; 
        }
                .interactive { pointer-events: auto; }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            width: 100%; 
            font-size: 10px; 
            letter-spacing: 2px; 
            color: #052211; 
            border-bottom: 1px solid rgba(0,255,102,0.08); 
            padding-bottom: 12px; 
        }
        
        .status-active { 
            color: #00ff66; 
            text-shadow: 0 0 10px rgba(0,255,102,0.6), 0 0 20px rgba(0,255,102,0.2); 
            animation: textPulse 2s infinite ease-in-out; 
            font-weight: bold;
        }
        
        #floating-logs { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1.5; pointer-events: none; overflow: hidden; }
        
        /* Прокачанные ИИ-теги */
        .ai-tag { 
            position: absolute; 
            font-size: 11px; 
            color: #00cc55; 
            letter-spacing: 1px; 
            white-space: nowrap; 
            transform: translate(-50%, -50%); 
            opacity: 0; 
            animation: crystalizeOut 4.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; 
            text-align: center; 
            background: rgba(1, 8, 4, 0.7);
            padding: 4px 8px;
            border-left: 2px solid #00ff66;
        }
        .ai-tag span { color: #fff; text-shadow: 0 0 8px #00ff66; font-weight: bold; }
        
        /* Элементы управления в стиле Цифрового Аскетизма */
        .tracker-box { 
            width: 100%; 
            background: rgba(1,6,4,0.92); 
            border: 1px solid rgba(0,255,102,0.15); 
            padding: 24px; 
            backdrop-filter: blur(15px); 
            position: relative;
        }
        
        /* Угловые маркеры для коробки (кибер-декор) */
        .tracker-box::before, .tracker-box::after {
            content: ''; position: absolute; width: 8px; height: 8px; border-color: #00ff66; border-style: solid;
        }
        .tracker-box::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
        .tracker-box::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

        .tracker-info { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 1.5px; color: #00aa55; margin-bottom: 12px; }
        
        .progress-bar-bg { width: 100%; height: 1px; background: rgba(0,255,102,0.1); position: relative; margin-bottom: 20px;}
        .progress-bar-fill { width: 0%; height: 100%; background: #00ff66; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 8px #00ff66; }
        
        /* Кнопка с неоновым контуром */
        .btn-audio-init { 
            background: transparent; 
            border: 1px solid rgba(0, 255, 102, 0.3); 
            color: #00ff66; 
            padding: 16px; 
            width: 100%; 
            font-size: 11px; 
            letter-spacing: 3px; 
            cursor: pointer; 
            transition: all 0.4s ease; 
            font-weight: bold; 
            text-shadow: 0 0 4px rgba(0,255,102,0.5);
            position: relative;
        }
        .btn-audio-init:active { transform: scale(0.99); }
        .btn-audio-init.active { 
            border-color: rgba(0, 255, 102, 0.1); 
            color: #00aa54; 
            background: transparent;
            pointer-events: none;
            text-shadow: none;
            letter-spacing: 1px;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.7; text-shadow: 0 0 8px rgba(0,255,102,0.4); }
            50% { opacity: 1; text-shadow: 0 0 15px rgba(0,255,102,0.8), 0 0 25px rgba(0,255,102,0.3); }
        }
        
        @keyframes crystalizeOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            10% { opacity: 1; }
            90% { opacity: 0.7; }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05) translateY(-20px); }
        }
    </style>
</head>
<body>
    <div id="canvas-container"><canvas id="coreCanvas"></canvas></div>
    <div id="floating-logs"></div>
    <div class="ui-layer">
        <header>
            <div id="versionTag">APXe // QUANTUM_CORE</div>
            <div class="status-active">[ СКАНИРОВАНИЕ РАЗУМА ]</div>
        </header>
        <div class="tracker-box interactive">
            <div class="tracker-info">
                <div>КРИСТАЛЛИЗАЦИЯ МЕНТАЛЬНОГО СЛЕПКА</div>
                <div id="progressPercent">0.0%</div>
            </div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
            <button class="btn-audio-init" id="audioBtn" onclick="initAudioCircuit()">ИНИЦИИРОВАТЬ АУДИОКОНТУР</button>
        </div>
    </div>
    <script>
                const tg = window.Telegram?.WebApp;
        let userTag = "[GUEST]";
        if (tg) {
            tg.ready(); tg.expand();
            if (tg.initDataUnsafe?.user?.username) { userTag = `@${tg.initDataUnsafe.user.username}`; }
            else if (tg.initDataUnsafe?.user?.first_name) { userTag = tg.initDataUnsafe.user.first_name; }
            document.getElementById('versionTag').innerText = `APXe // CORE // ${userTag.toUpperCase()}`;
        }
        
        const canvas = document.getElementById('coreCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        
        let innerRotation = 0; 
        let pulseRadius = window.innerWidth < 380 ? 110 : 130; 
        let audioModifier = 0; 
        let globalTime = 0;
        
        const particles = [];
        for (let i = 0; i < 18; i++) {
            particles.push({
                angle: (i / 18) * Math.PI * 2,
                length: 40 + Math.random() * 40,
                life: Math.random() * 5,
                maxOpacity: 0.4 + Math.random() * 0.4,
                waveOffset: Math.random() * 100
            });
        }
        
        function drawCyberCore() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            globalTime += 0.04 + (audioModifier * 0.12);
            
            const centerX = canvas.width / 2; 
            const centerY = canvas.height / 2;
            const currentRadius = pulseRadius + (audioModifier * 75); 
            
            ctx.save();
            let smokePulse = Math.sin(globalTime * 0.15) * 0.04 + 0.12;
            let smokeGlow = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, currentRadius * 3);
            smokeGlow.addColorStop(0, `rgba(0, 255, 102, ${smokePulse})`);
            smokeGlow.addColorStop(0.35, `rgba(0, 100, 45, ${smokePulse * 0.4})`);
            smokeGlow.addColorStop(0.7, 'rgba(1, 10, 5, 0.15)');
            smokeGlow.addColorStop(1, 'rgba(1, 6, 4, 0)');
            ctx.fillStyle = smokeGlow; ctx.fillRect(0, 0, canvas.width, canvas.height); 
            ctx.restore();
            
            ctx.shadowBlur = 20; 
            ctx.shadowColor = '#00ff66';
            
            particles.forEach(p => {
                p.life += 0.025;
                let cycleProgress = (p.life % 5) / 5;
                let opacityFactor = Math.sin(cycleProgress * Math.PI);
                let currentOpacity = p.maxOpacity * opacityFactor;
                
                if (p.life % 5 < 0.025) { p.length = 40 + Math.random() * 50; }
                
                const startX = centerX + Math.cos(p.angle) * currentRadius;
                const startY = centerY + Math.sin(p.angle) * currentRadius;
                const endX = centerX + Math.cos(p.angle) * (currentRadius + p.length);
                const endY = centerY + Math.sin(p.angle) * (currentRadius + p.length);
                
                const gradient = ctx.createLinearGradient(endX, endY, startX, startY);
                let wavePosition = (globalTime * 0.4 + p.waveOffset * 0.01) % 1;
                let nextPos = (wavePosition + 0.12) % 1;
                
                gradient.addColorStop(0, `rgba(0, 180, 70, 0)`);
                gradient.addColorStop(wavePosition, `rgba(0, 255, 102, ${currentOpacity})`);
                gradient.addColorStop(nextPos, `rgba(210, 255, 230, ${currentOpacity * (1.2 + audioModifier)})`);
                gradient.addColorStop(1, `rgba(0, 255, 102, ${currentOpacity * 0.15})`);
                
                ctx.beginPath(); 
                ctx.strokeStyle = gradient; 
                ctx.lineWidth = 4.5 + (audioModifier * 4); 
                ctx.moveTo(startX, startY); 
                ctx.lineTo(endX, endY); 
                ctx.stroke();
            });
            
            ctx.beginPath(); 
            ctx.arc(centerX, centerY, currentRadius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(0, 255, 102, ${0.7 + audioModifier * 0.3})`; 
            ctx.lineWidth = 5; 
            ctx.stroke();
            
            ctx.save(); 
            ctx.translate(centerX, centerY);
            innerRotation -= 0.005 + (audioModifier * 0.02); 
            ctx.rotate(innerRotation);
            
            let innerPulse = Math.sin(globalTime * 0.9) * 5; 
            let currentInnerRadius = Math.max(10, currentRadius - 22 + innerPulse);
            
            ctx.beginPath(); 
            ctx.arc(0, 0, currentInnerRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.4)'; 
            ctx.lineWidth = 1.5; 
            ctx.stroke(); 
            ctx.restore();
            
            ctx.shadowBlur = 0; 
            requestAnimationFrame(drawCyberCore);
        }
        drawCyberCore();
                let audioContext, analyser, dataArray; 
        let isAudioInitialized = false;
        
        function initAudioCircuit() {
            if (isAudioInitialized) return;
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser(); 
                    analyser.fftSize = 32;
                    const source = audioContext.createMediaStreamSource(stream); 
                    source.connect(analyser);
                    dataArray = new Uint8Array(analyser.frequencyBinCount); 
                    isAudioInitialized = true;
                    
                    const btn = document.getElementById('audioBtn');
                    btn.innerText = "СИНХРОНИЗАЦИЯ ПОТОКА УСПЕШНА"; 
                    btn.classList.add('active');
                    
                    function updateAudioData() {
                        if (!isAudioInitialized) return;
                        analyser.getByteFrequencyData(dataArray); 
                        let sum = 0;
                        for (let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
                        audioModifier = (sum / dataArray.length / 255); 
                        requestAnimationFrame(updateAudioData);
                    }
                    updateAudioData(); 
                    startSimulation();
                })
                .catch(err => { 
                    console.error("Ошибка микрофона:", err); 
                    alert("Контуру APXe необходим доступ к микрофону для калибровки."); 
                });
        }
        
        const aiMarkers = [
            `[Юзер: <span>${userTag}</span> -> Паттерн речи]`,
            "[Маркер: <span>Архетип Защитника</span>]",
            "[Лингвистика: <span>Сложный синтаксис</span>]",
            "[Метрика: <span>Высокая когнитивность</span>]",
            "[Контур: <span>Рационализация кризиса</span>]",
            "[Вектор: <span>Экзистенциальный сдвиг</span>]",
            "[Частота: <span>Модуляция зафиксирована</span>]",
            "[RAG-вектор: <span>Генерация слепка</span>]",
            "[Криптография: <span>E2EE Протокол</span>]"
        ];
        
        function spawnFloatingTag() {
            if (!isAudioInitialized) return;
            const container = document.getElementById('floating-logs');
            const tag = document.createElement('div'); 
            tag.className = 'ai-tag';
            tag.innerHTML = aiMarkers[Math.floor(Math.random() * aiMarkers.length)];
            
            const angle = Math.random() * Math.PI * 2; 
            const currentRadius = pulseRadius + (audioModifier * 75);
            const startDistance = currentRadius + 15; 
            const endDistance = startDistance + 60 + Math.random() * 55;
            
            let x = (window.innerWidth / 2) + Math.cos(angle) * endDistance;
            let y = (window.innerHeight / 2) + Math.sin(angle) * endDistance;
            
            if (x < 75) x = 75; 
            if (x > window.innerWidth - 175) x = window.innerWidth - 175;
            if (y < 120) y = 120; 
            if (y > window.innerHeight - 180) y = window.innerHeight - 180;
            
            tag.style.left = `${x}px`; 
            tag.style.top = `${y}px`;
            
            container.appendChild(tag); 
            setTimeout(() => { tag.remove(); }, 4500);
        }
        
        let progress = 0;
        function startSimulation() {
            const interval = setInterval(() => {
                if (progress < 100) {
                    const speedBoost = 0.05 + (audioModifier * 0.2);
                    const increment = Math.max(0.05, (100 - progress) * (0.03 + speedBoost)); 
                    progress += Math.random() * increment;
                    
                    if (progress > 100) progress = 100;
                    
                    document.getElementById('progressPercent').innerText = progress.toFixed(1) + "%";
                    document.getElementById('progressBar').style.width = progress + "%";
                    
                    if (Math.random() > (0.4 - audioModifier * 0.3)) spawnFloatingTag();
                } else {
                    clearInterval(interval); 
                    document.getElementById('progressPercent').innerText = "100% ДЕПОНИРОВАНО";
                    document.getElementById('audioBtn').innerText = "МЕНТАЛЬНЫЙ СЛЕПОК СОХРАНЕН";
                    
                    setTimeout(() => { 
                        if (tg) { 
                            tg.sendData(JSON.stringify({ status: "crystallized", user: userTag })); 
                            tg.close(); 
                        } 
                    }, 2200);
                }
            }, 600);
        }
    </script>
</body>
</html>
