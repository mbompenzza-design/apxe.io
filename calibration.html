<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APXe — Контур Калибровки</title>
    <script src="https://telegram.org"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #010805; color: #ffffff; overflow: hidden; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 25px 20px; }
        .interactive { pointer-events: auto; }

        header { display: flex; justify-content: space-between; width: 100%; font-size: 11px; letter-spacing: 1px; color: #0a331a; border-bottom: 1px solid rgba(0,255,102,0.05); padding-bottom: 15px; }
        .status-active { color: #00ff66; text-shadow: 0 0 8px rgba(0,255,102,0.4); animation: blink 1.5s infinite; }

        #floating-logs { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1.5; pointer-events: none; overflow: hidden; }
        
        /* Шрифт увеличен до 12px, добавлены безопасные отступы */
        .ai-tag { position: absolute; font-size: 12px; color: #00aa44; letter-spacing: 0.5px; white-space: nowrap; transform: translate(-50%, -50%); opacity: 0; animation: floatAndFade 5s linear forwards; text-align: center; font-weight: bold; }
        .ai-tag span { color: #fff; text-shadow: 0 0 4px #00ff66; }

        .tracker-box { width: 100%; background: rgba(1,10,5,0.95); border: 1px solid rgba(0,255,102,0.1); padding: 20px; backdrop-filter: blur(10px); border-radius: 4px; }
        .tracker-info { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 1px; color: #008844; margin-bottom: 10px; }
        .progress-bar-bg { width: 100%; height: 2px; background: rgba(0,255,102,0.05); position: relative; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: #00ff66; transition: width 0.5s ease; box-shadow: 0 0 10px #00ff66; }

        .btn-audio-init { background: transparent; border: 1px solid #005522; color: #00ff66; padding: 15px; width: 100%; font-size: 12px; letter-spacing: 2px; cursor: pointer; transition: all 0.3s; margin-top: 15px; font-weight: bold; text-shadow: 0 0 5px #00ff66; }
        .btn-audio-init:hover { background: #00ff66; color: #010805; }
        .btn-audio-init.active { border-color: #00ff66; color: #00ff66; background: rgba(0,255,102,0.05); }

        @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        
        @keyframes floatAndFade {
            0% { opacity: 0; transform: translate(-50%, -50%) translateY(5px); }
            15% { opacity: 0.9; }
            80% { opacity: 0.6; }
            100% { opacity: 0; transform: translate(-50%, -50%) translateY(-15px); }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="coreCanvas"></canvas>
    </div>

    <div id="floating-logs"></div>

    <div class="ui-layer">
        <header>
            <div id="versionTag">APXe // QUANTUM_CORE</div>
            <div class="status-active">[ СКАНИРОВАНИЕ РАЗУМА ]</div>
        </header>

        <div class="tracker-box interactive">
            <div class="tracker-info">
                <div>КРИСТАЛЛИЗАЦИЯ МЕНТАЛЬНОГО СЛЕПКА</div>
                <div id="progressPercent">0.0%</div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <button class="btn-audio-init" id="audioBtn" onclick="initAudioCircuit()">ИНИЦИИРОВАТЬ АУДИОКОНТУР</button>
        </div>
    </div>

    <script>
                // --- ИНИЦИАЛИЗАЦИЯ TELEGRAM SDK ---
        const tg = window.Telegram?.WebApp;
        let userTag = "[GUEST]";
        if (tg) {
            tg.ready(); tg.expand();
            if (tg.initDataUnsafe?.user?.username) {
                userTag = `@${tg.initDataUnsafe.user.username}`;
            } else if (tg.initDataUnsafe?.user?.first_name) {
                userTag = tg.initDataUnsafe.user.first_name;
            }
            document.getElementById('versionTag').innerText = `APXe // CORE // ${userTag.toUpperCase()}`;
        }

        // --- НАСТРОЙКА КАНВАСА ДЛЯ КИБЕР-КОЛЬЦА ---
        const canvas = document.getElementById('coreCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Параметры анимации ядра
        let innerRotation = 0;
        let pulseRadius = 140; 
        let audioModifier = 0; 
        let globalTime = 0;

        // Фиксированные позиции лучей
        const particles = [];
        for (let i = 0; i < 18; i++) {
            particles.push({
                angle: (i / 18) * Math.PI * 2,
                length: 50 + Math.random() * 50,
                life: Math.random() * 5,
                maxOpacity: 0.5 + Math.random() * 0.4,
                waveOffset: Math.random() * 100
            });
        }

        // --- ФУНКЦИЯ ОТРИСОВКИ КОНТУРА ЯДРА И ТУМАНА ---
        function drawCyberCore() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Световые волны разгоняются пропорционально громкости голоса
            globalTime += 0.05 + (audioModifier * 0.15);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Усиленная на 50% пульсация радиуса от микрофона
            const currentRadius = pulseRadius + (audioModifier * 68);
            
            // 1. ЖИВОЙ ИЗУМРУДНЫЙ ТУМАН (ДЫМ)
            ctx.save();
            let smokePulse = Math.sin(globalTime * 0.2) * 0.05 + 0.15;
            let smokeGlow = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, currentRadius * 2.5);
            smokeGlow.addColorStop(0, `rgba(0, 255, 102, ${smokePulse})`);
            smokeGlow.addColorStop(0.4, `rgba(0, 150, 70, ${smokePulse * 0.5})`);
            smokeGlow.addColorStop(0.8, 'rgba(1, 15, 8, 0.3)');
            smokeGlow.addColorStop(1, 'rgba(1, 8, 5, 0)');
            ctx.fillStyle = smokeGlow;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();

            ctx.shadowBlur = 30;
            ctx.shadowColor = '#00ff66';
            
            // 2. ОТРИСОВКА МЕРЦАЮЩИХ ЛУЧЕЙ (ПЛАВНЫЙ ЦИКЛ ПО 5 СЕК)
            particles.forEach(p => {
                p.life += 0.03;
                
                let cycleProgress = (p.life % 5) / 5; 
                let opacityFactor = Math.sin(cycleProgress * Math.PI); 
                let currentOpacity = p.maxOpacity * opacityFactor;
                
                if (p.life % 5 < 0.03) {
                    p.length = 50 + Math.random() * 50;
                }

                const startX = centerX + Math.cos(p.angle) * currentRadius;
                const startY = centerY + Math.sin(p.angle) * currentRadius;
                const endX = centerX + Math.cos(p.angle) * (currentRadius + p.length);
                const endY = centerY + Math.sin(p.angle) * (currentRadius + p.length);
                
                const gradient = ctx.createLinearGradient(endX, endY, startX, startY);
                
                // Фаза волны теперь ускоряется от голоса через globalTime
                let wavePosition = (globalTime * 0.35 + p.waveOffset * 0.01) % 1;
                let nextPos = (wavePosition + 0.15) % 1;
                
                gradient.addColorStop(0, `rgba(0, 200, 80, 0)`);
                gradient.addColorStop(wavePosition, `rgba(0, 255, 102, ${currentOpacity})`);
                gradient.addColorStop(nextPos, `rgba(255, 255, 255, ${currentOpacity * 1.6})`);
                gradient.addColorStop(1, `rgba(0, 255, 102, ${currentOpacity * 0.2})`);
                
                ctx.beginPath();
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 6.0; 
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            });
            
            // 3. Главное орбитальное кольцо (Широкое)
            ctx.beginPath();
            ctx.arc(centerX, centerY, currentRadius, 0, Math.PI * 2);
            ctx.strokeStyle = '#00ff66';
            ctx.lineWidth = 6;
            ctx.stroke();
            
            // 4. Второе внутреннее кольцо (Пульсация + обратное вращение)
            ctx.save();
            ctx.translate(centerX, centerY);
            innerRotation -= 0.006 + (audioModifier * 0.015);
            ctx.rotate(innerRotation);
            
            let innerPulse = Math.sin(globalTime * 0.8) * 6; 
            let currentInnerRadius = currentRadius - 25 + innerPulse;
            
            ctx.beginPath();
            ctx.arc(0, 0, currentInnerRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.75)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
            
            ctx.shadowBlur = 0; 
            requestAnimationFrame(drawCyberCore);
        }
        
        drawCyberCore();
                // --- СИНХРОНИЗАЦИЯ ГОЛОСА И МИКРОФОНА ---
        let audioContext, analyser, dataArray;
        let isAudioInitialized = false;

        function initAudioCircuit() {
            if (isAudioInitialized) return;

            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 32;
                    
                    const source = audioContext.createMediaStreamSource(stream);
                    source.connect(analyser);
                    
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    isAudioInitialized = true;
                    
                    const btn = document.getElementById('audioBtn');
                    btn.innerText = "РЕЧЕВОЙ КОНТУР СИНХРОНИЗИРОВАН";
                    btn.classList.add('active');
                    
                    function updateAudioData() {
                        if (!isAudioInitialized) return;
                        analyser.getByteFrequencyData(dataArray);
                        let sum = 0;
                        for (let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
                        audioModifier = sum / dataArray.length / 255;
                        requestAnimationFrame(updateAudioData);
                    }
                    updateAudioData();
                    startSimulation();
                })
                .catch(err => {
                    console.error("Ошибка микрофона:", err);
                    alert("Требуется доступ к аудиопотоку для фиксации частот.");
                });
        }

        // --- КОНТУР ИЗУМРУДНЫХ РАНДОМНЫХ ТЕГОВ ---
        const aiMarkers = [
            `[Юзер: <span>${userTag}</span> -> Анализ паттернов]`,
            "[Смысловой маркер: <span>Фигура отца -> Архетип Защитника</span>]",
            "[Лингво-структура: <span>Сложный синтаксический паттерн</span>]",
            "[Психо-метрика: <span>Высокий порог когнитивной эмпатии</span>]",
            "[Логический контур: <span>Рационализация кризисных состояний</span>]",
            "[Смысловой маркер: <span>Экзистенциальный вектор развития</span>]",
            "[Голосовой маркер: <span>Частотные модуляции зафиксированы</span>]",
            "[Веса личности: <span>Генерация уникального RAG-вектора</span>]",
            "[Безопасность: <span>Шифрование данных алгоритмом E2EE</span>]"
        ];

        // Ультра-безопасный спавн тегов строго вокруг сферы
        function spawnFloatingTag() {
            if (!isAudioInitialized) return;
            
            const container = document.getElementById('floating-logs');
            const tag = document.createElement('div');
            tag.className = 'ai-tag';
            tag.innerHTML = aiMarkers[Math.floor(Math.random() * aiMarkers.length)];
            
            // Зажимаем теги в более близкий коридор к сфере, чтобы крупные надписи помещались
            const angle = Math.random() * Math.PI * 2;
            const distance = 160 + Math.random() * 40; 
            
            let x = (window.innerWidth / 2) + Math.cos(angle) * distance;
            let y = (window.innerHeight / 2) + Math.sin(angle) * distance;
            
            // Жесткие лимиты безопасности от краев экрана с учетом длинных фраз
            if (x < 65) x = 65;
            if (x > window.innerWidth - 170) x = window.innerWidth - 170;
            
            if (y < 130) y = 130;
            if (y > window.innerHeight - 190) y = window.innerHeight - 190;
            
            tag.style.left = `${x}px`;
            tag.style.top = `${y}px`;
            
            container.appendChild(tag);
            
            // Плавное таяние за 5 секунд
            setTimeout(() => { tag.remove(); }, 5000);
        }

        let progress = 0;
        function startSimulation() {
            const interval = setInterval(() => {
                if (progress < 100) {
                    const increment = Math.max(0.08, (100 - progress) * 0.04);
                    progress += Math.random() * increment;
                    if (progress > 100) progress = 100;
                    
                    document.getElementById('progressPercent').innerText = progress.toFixed(1) + "%";
                    document.getElementById('progressBar').style.width = progress + "%";
                    
                    if (Math.random() > 0.4) spawnFloatingTag();
                } else {
                    clearInterval(interval);
                    document.getElementById('progressPercent').innerText = "100% ФИКСАЦИЯ";
                    document.getElementById('audioBtn').innerText = "ЯДРО ДЕПОНИРОВАНО";
                    
                    setTimeout(() => {
                        if (tg) {
                            tg.sendData(JSON.stringify({ status: "crystallized", user: userTag }));
                            tg.close();
                        }
                    }, 2000);
                }
            }, 700);
        }
    </script>
</body>
</html>
