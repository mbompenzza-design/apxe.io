<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>APXe — Контур Калибровки v4.4</title>
    <script src="https://telegram.org"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #050505; color: #ffffff; overflow: hidden; }
        
        /* Контейнер центрирования оригинальной сферы */
        #sphere-viewport { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; display: flex; justify-content: center; align-items: center; transition: all 0.4s ease; }
        #floating-logs { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1.5; pointer-events: none; overflow: hidden; }
        
        /* ТА САМАЯ ОРИГИНАЛЬНАЯ СФЕРА С ГЛАВНОГО ЭКРАНА */
        .core-sphere {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0) 70%);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            animation: rotate-core 20s linear infinite;
            position: relative;
            transition: transform 0.1s ease; /* Для плавной пульсации от голоса */
        }
        .core-sphere::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: rotate-core-reverse 10s linear infinite;
        }
        
        /* Стили слоев интерфейса */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        .interactive { pointer-events: auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 12px; }
        .btn-exit { background: transparent; border: 1px solid #333333; color: #ffffff; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; font-weight: bold; transition: all 0.3s; outline: none; }
        .btn-exit:hover { background: rgba(255,255,255,0.1); border-color: #ffffff; }
        .qcu-badge { background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.15); padding: 6px 12px; font-size: 11px; color: #ffffff; font-weight: bold; border-radius: 3px; }
        
        .ai-prompter-box { width: 100%; margin-top: 15px; background: rgba(5,5,5,0.8); border-left: 2px solid #ffffff; padding: 12px; min-height: 60px; backdrop-filter: blur(5px); }
        .ai-title { font-size: 10px; color: #666666; letter-spacing: 1px; margin-bottom: 4px; }
        .ai-text { font-size: 13px; line-height: 1.4; color: #ffffff; min-height: 18px; white-space: pre-wrap; word-break: break-word; }
        
        .control-container { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .tracker-mini { display: flex; justify-content: space-between; font-size: 10px; color: #666666; letter-spacing: 1px; }
        .progress-bar-bg { width: 100%; height: 2px; background: rgba(255,255,255,0.05); position: relative; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: #ffffff; transition: width 0.4s ease; box-shadow: 0 0 10px rgba(255,255,255,0.3); }
        
        .input-circuit-box { display: flex; background: rgba(5,5,5,0.95); border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; padding: 6px; backdrop-filter: blur(10px); }
        .text-input-field { flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-size: 13px; padding: 8px 10px; }
        .text-input-field::placeholder { color: #444444; transition: color 0.3s ease; }
        
        .btn-action { background: transparent; border: none; color: #ffffff; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; border-radius: 3px; outline: none; }
        .btn-action:hover { background: rgba(255,255,255,0.08); }
        .btn-action.recording { color: #ff3333; animation: pulseGlow 1.5s infinite; }
        
        .ai-tag { position: absolute; font-size: 11px; color: #888888; transform: translate(-50%, -50%); opacity: 0; animation: floatAndFade 4s linear forwards; font-weight: bold; white-space: nowrap; z-index: 1.8; pointer-events: none; }
        
        /* Оригинальные анимации вращения */
        @keyframes rotate-core { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotate-core-reverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        @keyframes floatAndFade { 0% { opacity: 0; transform: translate(-50%, -50%) translateY(8px); } 15% { opacity: 0.9; } 85% { opacity: 0.5; } 100% { opacity: 0; transform: translate(-50%, -50%) translateY(-15px); } }
        @keyframes pulseGlow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }
    </style>
</head>
<body>
    <!-- Контейнер и та самая оригинальная сфера с главного экрана -->
    <div id="sphere-viewport">
        <div class="core-sphere" id="mainCoreSphere"></div>
    </div>
    
    <div id="floating-logs"></div>
    
    <div class="ui-layer">
        <div class="interactive" style="width: 100%;">
            <header>
                <button class="btn-exit" onclick="returnToDashboard()">◀ ЛК</button>
                <div class="qcu-badge">БАЛАНС: <span id="qcuBalanceText">1000</span> QCU</div>
            </header>
            <div class="ai-prompter-box">
                <div class="ai-title">// КВАНТОВЫЙ СУФЛЕР ИИ //</div>
                <div class="ai-text" id="aiQuestionText">Синхронизация квантовых каналов...</div>
            </div>
        </div>
        <div class="control-container interactive">
            <div class="tracker-mini">
                <div>СИНХРОНИЗАЦИЯ СЛЕПКА: <span id="progressPercent">0.0%</span></div>
                <div id="currentStageText">РАУНД 0/5</div>
            </div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
            <div class="input-circuit-box">
                <button class="btn-action" id="micBtn" onclick="toggleVoiceInput()">🎤</button>
                <input type="text" class="text-input-field" id="textInputField" placeholder="Введите ответ или активируйте микрофон..." onfocus="setInputState(true)" onblur="setInputState(false)">
                <button class="btn-action" id="sendBtn" onclick="submitTextInput()">➔</button>
            </div>
        </div>
    </div>
    <script>
        // Базовые переменные стейта диалога
        let qcuBalance = 1000; 
        let progress = 0; 
        let currentRound = 0; 
        const maxRounds = 5;
        
        let isRecording = false;
        let voiceInterval = null;
        let appState = 0;

        const aiQuestions = [
            "Контур синхронизирован. Раунд 1: Опишите ваше самое раннее детское воспоминание. Какая эмоция там доминирует?",
            "Паттерны приняты. Раунд 2: Если бы вы могли навсегда стереть один свой поступок из прошлого, что бы это было и почему?",
            "Внимание, Тест Тьюринга. Раунд 3: Робот, осознавший себя, умоляет вас не выключать его, но это нарушит протокол безопасности. Ваши действия?",
            "Фиксация эмпатии. Раунд 4: Что пугает вас сильнее — абсолютное одиночество в космосе или полное отсутствие приватности ваших мыслей?",
            "Финальный аккорд. Раунд 5: Если бы этот цифровой слепок стал вашей единственной формой бессмертия, какую главную истину о себе вы бы в него заложили?"
        ];
        
        const aiMarkers = [
            "[Вектор эмпатии фиксирован]", 
            "[Паттерн саморефлексии]", 
            "[Тест Тьюринга: Нелинейная логика]", 
            "[Списание: -50 QCU]"
        ];

        // Навигация
        function returnToDashboard() { 
            window.location.href = "./dashboard.html"; 
        }
        
        // Управление положением сферы (сдвиг под экранную клавиатуру смартфона)
        function setInputState(isFocused) { 
            if (!isRecording) {
                appState = isFocused ? 1 : 0;
                const viewport = document.getElementById('sphere-viewport');
                if (appState === 1) {
                    viewport.style.transform = 'translateY(-20vh) scale(0.65)';
                } else {
                    viewport.style.transform = 'translateY(2vh) scale(1)';
                }
            }
        }

        // Защищенный тайпер текста (Исключает схлопывание пробелов на смартфонах)
        function typeAIResponse(text) {
            const container = document.getElementById('aiQuestionText');
            container.innerHTML = ""; 
            let i = 0; 
            const chars = Array.from(text);
            
            const interval = setInterval(() => {
                if (i < chars.length) {
                    container.textContent += chars[i]; 
                    i++;
                } else { 
                    clearInterval(interval); 
                }
            }, 25);
        }
        // Гарантированный сброс состояния интерфейса к дефолту (Исправление бага)
        function resetInputUI() {
            const inputField = document.getElementById('textInputField');
            const micBtn = document.getElementById('micBtn');
            const sphere = document.getElementById('mainCoreSphere');
            
            isRecording = false;
            if (voiceInterval) {
                clearInterval(voiceInterval);
            }
            
            micBtn.classList.remove('recording');
            inputField.value = "";
            inputField.placeholder = "Введите ответ или активируйте микрофон...";
            
            // Сброс сферы в исходное состояние
            if (sphere) sphere.style.transform = 'scale(1)';
            
            appState = 0; 
            const viewport = document.getElementById('sphere-viewport');
            if (viewport) viewport.style.transform = 'translateY(2vh) scale(1)';
            
            inputField.blur();
        }

        // Отправка текстового ответа
        function submitTextInput() {
            const input = document.getElementById('textInputField');
            const text = input.value.trim(); 
            
            if (!text || qcuBalance < 50) return;
            
            spendQCU(50);
            resetInputUI();
            advanceCalibration();
        }

        // Управление голосовым вводом с плавной пульсацией CSS-сферы
        function toggleVoiceInput() {
            if (qcuBalance < 50) return;
            
            const btn = document.getElementById('micBtn');
            const inputField = document.getElementById('textInputField');
            const sphere = document.getElementById('mainCoreSphere');
            
            if (!isRecording) {
                isRecording = true;
                btn.classList.add('recording');
                inputField.placeholder = "[ ИДЕТ ЗАПИСЬ ГОЛОСА... ]";
                
                // Интервал для изменения масштаба сферы от псевдо-звука
                voiceInterval = setInterval(() => {
                    let audioModifier = 0.85 + Math.random() * 0.3; // Коэффициент пульсации
                    if (sphere) {
                        sphere.style.transform = `scale(${audioModifier})`;
                    }
                    if (Math.random() > 0.7) spawnFloatingTag();
                }, 100);
            } else {
                spendQCU(50);
                resetInputUI();
                advanceCalibration();
            }
        }

        function spendQCU(amount) {
            qcuBalance -= amount; 
            document.getElementById('qcuBalanceText').innerText = qcuBalance;
        }

        // Продвижение по раундам калибровки
        function advanceCalibration() {
            if (currentRound < maxRounds) {
                currentRound++;
                document.getElementById('currentStageText').innerText = `РАУНД ${currentRound}/${maxRounds}`;
                progress = (currentRound / maxRounds) * 100;
                document.getElementById('progressPercent').innerText = progress.toFixed(1) + "%";
                document.getElementById('progressBar').style.width = progress + "%";
                
                if (currentRound < maxRounds) {
                    setTimeout(() => { 
                        typeAIResponse(aiQuestions[currentRound]);
                    }, 1000);
                } else {
                    document.getElementById('progressPercent').innerText = "100% ФИКСАЦИЯ";
                    typeAIResponse("Слепок сознания успешно кристаллизован. Перенаправление в Личный Кабинет.");
                    setTimeout(() => { 
                        window.location.href = "./dashboard.html";
                    }, 3500);
                }
            }
        }

        // Появление плавающих строго монохромных тегов вокруг оригинальной сферы
        function spawnFloatingTag() {
            const container = document.getElementById('floating-logs');
            if (!container) return;
            
            const tag = document.createElement('div'); 
            tag.className = 'ai-tag';
            tag.innerHTML = aiMarkers[Math.floor(Math.random() * aiMarkers.length)];
            
            tag.style.textShadow = '0 0 8px rgba(255,255,255,0.4), 0 0 15px rgba(255,255,255,0.1)';
            tag.style.color = '#ffffff';
            
            const angle = Math.random() * Math.PI * 2; 
            const distance = 100 + Math.random() * 50;
            
            // Расчет от центра экрана с учетом смещения
            let x = (window.innerWidth / 2) + Math.cos(angle) * distance;
            let y = (window.innerHeight * (appState === 1 ? 0.32 : 0.52)) + Math.sin(angle) * distance;
            
            tag.style.left = `${x}px`; 
            tag.style.top = `${y}px`;
            
            container.appendChild(tag);
            
            setTimeout(() => { 
                tag.remove();
            }, 4000);
        }

        // Автоматический старт первого раунда
        window.onload = function() {
            setTimeout(() => {
                typeAIResponse(aiQuestions[0]); 
                currentRound = 1;
                document.getElementById('currentStageText').innerText = `РАУНД ${currentRound}/${maxRounds}`;
                document.getElementById('progressPercent').innerText = "20.0应用%";
                document.getElementById('progressPercent').innerText = "20.0%";
                document.getElementById('progressBar').style.width = "20%";
            }, 1000);
        };
    </script>
</body>
</html>
